<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2469eb">
<title>Сонсох материал — MY ДЭВТЭР</title>
<style>
:root{
  --accent:#2469eb;--soft:#eaf2ff;--ink:#17213a;--muted:#70788a;--line:#e3e7ee;
  --bg:#f7f4ef;--card:#fff;--shadow:0 18px 42px rgba(25,39,73,.08)
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
background:radial-gradient(circle at 10% 8%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 28%),linear-gradient(180deg,#fbfaf7,var(--bg))}
a,button{font:inherit}a{text-decoration:none;color:inherit}
.wrap{width:min(820px,calc(100% - 24px));margin:auto;padding:20px 0 70px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;gap:10px;align-items:center;font-weight:950}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--accent),#4bc9d5);box-shadow:0 10px 20px color-mix(in srgb,var(--accent) 22%,transparent)}
.back{padding:10px 13px;border-radius:13px;background:#fff;border:1px solid var(--line);color:#46516a;font-size:13px;font-weight:800}
.hero{background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:126px 1fr;gap:18px;align-items:center}
.cover{width:126px;aspect-ratio:.76;border-radius:18px;overflow:hidden;background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 20%,white)}
.cover img{width:100%;height:100%;object-fit:cover}
.kicker{font-size:11px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.hero h1{margin:7px 0 0;font-size:30px;letter-spacing:-.045em;line-height:1.05}
.section{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:8px}
.section h2{margin:0;font-size:21px;letter-spacing:-.03em}
.count{font-size:12px;color:var(--muted);font-weight:800}
.group-block{margin-top:14px}
.group-block:first-child{margin-top:0}
.group-title{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:14px;font-weight:950;color:#2d3b58}
.track-list{list-style:none;margin:0;padding:0}
.track{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid #edf0f4}
.track:last-child{border-bottom:0}
.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:12px;font-weight:950}
.track-name{font-size:14px;font-weight:850;line-height:1.4}
.play{width:34px;height:34px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:950;cursor:pointer}
.play.active{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 16%,transparent)}
.player-card{margin-top:14px;padding:14px;border-radius:18px;border:1px solid color-mix(in srgb,var(--accent) 18%,white);background:linear-gradient(135deg,#fff,var(--soft))}
.now{font-size:11px;color:var(--muted);margin-bottom:5px}
.now-title{font-size:15px;font-weight:950;margin-bottom:9px}
audio{width:100%;height:42px}
.empty{padding:25px 10px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:520px){
  .hero{grid-template-columns:88px 1fr;padding:15px;gap:13px}.cover{width:88px}.hero h1{font-size:23px}
  .track{grid-template-columns:32px minmax(0,1fr) 34px}
}
</style>
</head>
<body>
<script src="site-data.js"></script>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="logo">♫</span><span id="brand">Хөгжмийн дасгал ажлын дэвтэр</span></div>
    <a class="back" href="index.html">← Нүүр сайт</a>
  </div>

  <section class="hero">
    <div class="cover" id="cover"></div>
    <div>
      <div class="kicker" id="kicker"></div>
      <h1 id="title">Дэвтэр</h1>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 id="sectionTitle">Сонсох материал</h2>
      <span class="count" id="count"></span>
    </div>
    <div id="content"></div>
  </section>
</div>

<script>
(async()=>{
  await (window.MYDEWTER_READY || Promise.resolve());

  const $=id=>document.getElementById(id);
  const params=new URLSearchParams(location.search);
  const gradeNumber=Math.max(1,Math.min(5,Number(params.get('grade'))||2));
  const group=(params.get('group')||'').trim();
  const trackCode=(params.get('track')||'').trim();

  let DATA=window.MYDEWTER_DATA||{};

  // QR/group pages always ask backend for newest published Studio data.
  if(group || trackCode){
    try{
      const api=DATA.orderApiUrl||'';
      if(api){
        const res=await fetch(api+(api.includes('?')?'&':'?')+'action=getSiteData&_='+Date.now(),{cache:'no-store'});
        const fresh=await res.json();
        if(fresh&&fresh.ok&&fresh.data){
          DATA=Object.assign({},DATA,fresh.data);
          window.MYDEWTER_DATA=DATA;
          try{localStorage.setItem('mydewter_public_cache_v26',JSON.stringify(DATA))}catch(e){}
        }
      }
    }catch(e){console.warn('Fresh audio data fetch failed',e)}
  }

  const grade=(DATA.grades||[]).find(g=>Number(g.grade)===gradeNumber);
  const theme={
    1:{accent:'#57c8d4',soft:'#e8fbff'},
    2:{accent:'#f0a24e',soft:'#fff2e3'},
    3:{accent:'#2469eb',soft:'#eaf2ff'},
    4:{accent:'#5b4dc7',soft:'#f0edff'},
    5:{accent:'#2e9db8',soft:'#eafaff'}
  }[gradeNumber];

  document.documentElement.style.setProperty('--accent',theme.accent);
  document.documentElement.style.setProperty('--soft',theme.soft);
  $('brand').textContent=DATA.brand||'Хөгжмийн дасгал ажлын дэвтэр';
  $('title').textContent=(grade&&grade.title)||gradeNumber+'-р ангийн дэвтэр';
  if(grade&&grade.image)$('cover').innerHTML=`<img src="${escAttr(grade.image)}" alt="">`;

  if(!grade){
    $('content').innerHTML='<div class="empty">Мэдээлэл олдсонгүй.</div>';
    return;
  }

  const tracks=(Array.isArray(grade.listeningTracks)?grade.listeningTracks:[]).map(t=>{
    if(typeof t==='string')return {name:t,audio:'',type:'assessment',code:''};
    const x=Object.assign({},t||{});
    if(!x.type)x.type='assessment';
    return x;
  });

  // 1) One assessment QR = one track.
  if(trackCode){
    $('kicker').textContent='';
    const t=tracks.find(x=>String(x.code||'')===trackCode);
    $('sectionTitle').textContent=t&&t.name?t.name:'Сонсох материал';
    $('count').textContent='';
    if(!t || !(t.audio||t.url)){
      $('content').innerHTML='<div class="empty">Сонсох материал олдсонгүй.</div>';
      return;
    }
    $('content').innerHTML=`
      <div class="player-card">
        <div class="now">Сонсох материал</div>
        <div class="now-title">${esc(t.name||'')}</div>
        <audio controls preload="metadata" controlsList="nodownload" src="${escAttr(t.audio||t.url||'')}"></audio>
      </div>`;
    return;
  }

  // 2) One group QR = all listening tracks OR all songs.
  if(group==='listening' || group==='songs'){
    const selected=tracks.filter(t=>t.type===group);
    const label=group==='listening'?'Сонсох хөгжим':'Дуу';
    $('kicker').textContent=label.toUpperCase();
    $('sectionTitle').textContent=label;
    $('count').textContent=selected.length?selected.length+' материал':'';

    if(!selected.length){
      $('content').innerHTML='<div class="empty">Материал хараахан нэмэгдээгүй байна.</div>';
      return;
    }

    $('content').innerHTML=`
      <ol class="track-list" id="groupTracks">
        ${selected.map((t,i)=>`
          <li class="track">
            <span class="num">${i+1}</span>
            <span class="track-name">${esc(t.name||'Нэргүй')}</span>
            <button class="play" type="button" data-play="${i}" aria-label="Сонсох">▶</button>
          </li>`).join('')}
      </ol>
      <div class="player-card">
        <div class="now">Одоо сонсож байна</div>
        <div class="now-title" id="nowTitle">${esc(selected[0].name||'')}</div>
        <audio id="groupAudio" controls preload="metadata" controlsList="nodownload"></audio>
      </div>`;

    const audio=$('groupAudio');
    const buttons=[...document.querySelectorAll('[data-play]')];

    function loadTrack(i,autoplay=false){
      const t=selected[i];
      audio.src=t.audio||t.url||'';
      $('nowTitle').textContent=t.name||'';
      buttons.forEach((b,j)=>b.classList.toggle('active',j===i));
      if(autoplay && audio.src)audio.play().catch(()=>{});
    }
    buttons.forEach(btn=>btn.onclick=()=>loadTrack(+btn.dataset.play,true));
    loadTrack(0,false);
    return;
  }

  // 3) Public page = names only, no audio.
  $('kicker').textContent='СОНСОХ ХӨГЖМИЙН ЖАГСААЛТ';
  $('sectionTitle').textContent='Нэрс';
  $('count').textContent=tracks.length?tracks.length+' материал':'';

  const groups=[
    ['listening','🎧 Сонсох хөгжим'],
    ['songs','🎤 Дуу'],
    ['assessment','📝 Гүйцэтгэлийн үнэлгээ']
  ];

  const html=groups.map(([type,label])=>{
    const arr=tracks.filter(t=>t.type===type);
    if(!arr.length)return '';
    return `<div class="group-block">
      <div class="group-title">${label}</div>
      <ol class="track-list">
        ${arr.map((t,i)=>`
          <li class="track" style="grid-template-columns:38px minmax(0,1fr)">
            <span class="num">${i+1}</span>
            <span class="track-name">${esc(t.name||'Нэргүй')}</span>
          </li>`).join('')}
      </ol>
    </div>`;
  }).join('');

  $('content').innerHTML=html||'<div class="empty">Сонсох материал хараахан нэмэгдээгүй байна.</div>';

  function esc(v){
    return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  }
  function escAttr(v){return esc(v)}
})();
</script>
</body>
</html>
