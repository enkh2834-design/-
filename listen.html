<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2469eb">
<title>Сонсох хөгжим — MY ДЭВТЭР</title>
<style>
:root{
  --accent:#2469eb;--soft:#eaf2ff;--ink:#17213a;--muted:#70788a;--line:#e3e7ee;
  --bg:#f7f4ef;--card:#fff;--shadow:0 18px 42px rgba(25,39,73,.08);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 8%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 28%),
    linear-gradient(180deg,#fbfaf7,var(--bg));
}
button,a{font:inherit}a{text-decoration:none;color:inherit}
.wrap{width:min(760px,calc(100% - 24px));margin:auto;padding:20px 0 110px}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px
}
.brand{display:flex;gap:10px;align-items:center;font-weight:950}
.logo{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--accent),#4bc9d5);
  box-shadow:0 10px 20px color-mix(in srgb,var(--accent) 22%,transparent)
}
.back{
  padding:10px 13px;border-radius:13px;background:#fff;border:1px solid var(--line);
  color:#46516a;font-size:13px;font-weight:800
}
.hero{
  position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);
  border-radius:26px;padding:20px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:126px 1fr;gap:18px;align-items:center
}
.hero:after{
  content:"♪ ♫ ♬";position:absolute;right:14px;top:8px;font-size:38px;letter-spacing:9px;
  color:color-mix(in srgb,var(--accent) 9%,transparent);pointer-events:none
}
.cover{
  width:126px;aspect-ratio:.76;border-radius:18px;overflow:hidden;background:var(--soft);
  border:1px solid color-mix(in srgb,var(--accent) 20%,white);box-shadow:0 12px 24px rgba(30,45,82,.08)
}
.cover img{width:100%;height:100%;object-fit:cover}
.kicker{font-size:11px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero h1{margin:7px 0 8px;font-size:30px;letter-spacing:-.045em;line-height:1.05}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
.link-box{
  margin-top:14px;padding:12px 14px;background:var(--soft);
  border:1px solid color-mix(in srgb,var(--accent) 18%,white);border-radius:15px;
  font-size:12px;color:#4c5870;display:flex;gap:10px;justify-content:space-between;align-items:center
}
.copy-btn{
  flex:0 0 auto;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;
  background:#fff;color:var(--accent);font-weight:850;border:1px solid color-mix(in srgb,var(--accent) 22%,white)
}
.section{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:8px}
.section h2{margin:0;font-size:21px;letter-spacing:-.03em}
.count{font-size:12px;color:var(--muted);font-weight:800}
.track-list{list-style:none;margin:0;padding:0}
.track{
  display:grid;grid-template-columns:38px 1fr 34px;gap:10px;align-items:center;
  padding:14px 4px;border-bottom:1px solid #edf0f4;cursor:default
}
.track:last-child{border-bottom:0}
.track.playable{cursor:pointer}
.num{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:var(--soft);color:var(--accent);font-size:12px;font-weight:950
}
.track-name{font-size:15px;font-weight:850;line-height:1.4}
.play-icon{
  width:30px;height:30px;border-radius:50%;display:none;place-items:center;
  background:var(--accent);color:#fff;font-size:11px
}
.track.playable .play-icon{display:grid}
.track.active{color:var(--accent)}
.track.active .num{background:var(--accent);color:#fff}
.empty{
  padding:28px 10px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7
}
.player{
  position:fixed;left:12px;right:12px;bottom:12px;z-index:20;
  width:min(736px,calc(100% - 24px));margin:auto;
  background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:20px;padding:11px 13px;
  box-shadow:0 20px 55px rgba(20,32,70,.18);
  display:none
}
.player.show{display:block;animation:up .28s ease both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.now{font-size:11px;color:var(--muted);margin-bottom:5px}
.now-title{font-size:13px;font-weight:900;margin-bottom:8px}
audio{width:100%;height:38px}
@media(max-width:520px){
  .hero{grid-template-columns:88px 1fr;padding:15px;gap:13px}
  .cover{width:88px}
  .hero h1{font-size:23px}
  .link-box{display:block}
  .copy-btn{margin-top:9px}
}
</style>
</head>
<body>
<script src="site-data.js"></script>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="logo">♫</span><span id="brand">MY ДЭВТЭР</span></div>
    <a class="back" href="index.html">← Нүүр сайт</a>
  </div>

  <section class="hero">
    <div class="cover" id="cover"></div>
    <div>
      <div class="kicker">Сонсох хөгжим</div>
      <h1 id="title">Дэвтэр</h1>
      <p>Доорх жагсаалтаас хөгжмийн нэрийг сонгоод сонсоно. Дэвтэр дээрх QR код энэ хуудас руу тогтмол холбоно.</p>
    </div>
  </section>

  <div class="link-box">
    <span><b>QR-д ашиглах тогтмол холбоос:</b><br><span id="staticLink"></span></span>
    <button class="copy-btn" id="copyBtn">Хуулах</button>
  </div>

  <section class="section">
    <div class="section-head">
      <h2>Сонсох хөгжмийн жагсаалт</h2>
      <span class="count" id="count"></span>
    </div>
    <ol class="track-list" id="tracks"></ol>
  </section>
</div>

<div class="player" id="playerBox">
  <div class="now">Одоо сонсож байна</div>
  <div class="now-title" id="nowTitle"></div>
  <audio id="audio" controls preload="metadata"></audio>
</div>

<script>
(async()=>{
  await (window.MYDEWTER_READY || Promise.resolve());

const DATA=window.MYDEWTER_DATA||{};
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const gradeNumber=Math.max(1,Math.min(5,Number(params.get('grade'))||4));
const grade=(DATA.grades||[]).find(g=>Number(g.grade)===gradeNumber);
const theme={
  1:{accent:'#57c8d4',soft:'#e8fbff'},
  2:{accent:'#f0a24e',soft:'#fff2e3'},
  3:{accent:'#2469eb',soft:'#eaf2ff'},
  4:{accent:'#5b4dc7',soft:'#f0edff'},
  5:{accent:'#2e9db8',soft:'#eafaff'}
}[gradeNumber];

document.documentElement.style.setProperty('--accent',theme.accent);
document.documentElement.style.setProperty('--soft',theme.soft);
$('brand').textContent=DATA.brand||'MY ДЭВТЭР';

if(!grade){
  $('title').textContent=gradeNumber+'-р анги';
  $('tracks').innerHTML='<li class="empty">Энэ ангийн мэдээлэл олдсонгүй.</li>';
}else{
  $('title').textContent=grade.title||gradeNumber+'-р анги';
  if(grade.image) $('cover').innerHTML=`<img src="${grade.image}" alt="${grade.title||''}">`;

  const tracks=Array.isArray(grade.listeningTracks)?grade.listeningTracks:[];
  $('count').textContent=tracks.length?tracks.length+' бүтээл':'';
  if(!tracks.length){
    $('tracks').innerHTML='<li class="empty">Сонсох хөгжмийн жагсаалтыг editor хэсгээс нэмнэ.</li>';
  }else{
    $('tracks').innerHTML=tracks.map((t,i)=>{
      const name=typeof t==='string'?t:(t.name||'Нэргүй бүтээл');
      const src=typeof t==='string'?'':(t.audio||t.url||'');
      return `<li class="track ${src?'playable':''}" data-src="${encodeURIComponent(src)}" data-name="${encodeURIComponent(name)}">
        <span class="num">${i+1}</span>
        <span class="track-name">${name}</span>
        <span class="play-icon">▶</span>
      </li>`;
    }).join('');
  }
}

const stable=`${location.origin}${location.pathname}?grade=${gradeNumber}`;
$('staticLink').textContent=stable;
$('copyBtn').onclick=async()=>{
  try{
    await navigator.clipboard.writeText(stable);
    $('copyBtn').textContent='Хууллаа ✓';
    setTimeout(()=>$('copyBtn').textContent='Хуулах',1400);
  }catch(e){
    prompt('Энэ холбоосыг хуулна уу:',stable);
  }
};

const audio=$('audio');
document.addEventListener('click',e=>{
  const row=e.target.closest('.track.playable');
  if(!row)return;
  document.querySelectorAll('.track.active').forEach(x=>x.classList.remove('active'));
  row.classList.add('active');
  const src=decodeURIComponent(row.dataset.src||'');
  const name=decodeURIComponent(row.dataset.name||'');
  $('nowTitle').textContent=name;
  audio.src=src;
  $('playerBox').classList.add('show');
  audio.play().catch(()=>{});
});

})();
</script>
</body>
</html>
