<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2469eb">
<title>Сонсох материал — MY ДЭВТЭР</title>
<style>
:root{
  --accent:#2469eb;--soft:#eaf2ff;--ink:#17213a;--muted:#70788a;--line:#e3e7ee;
  --bg:#f7f4ef;--card:#fff;--shadow:0 18px 42px rgba(25,39,73,.08)
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
background:radial-gradient(circle at 10% 8%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 28%),linear-gradient(180deg,#fbfaf7,var(--bg))}
a,button{font:inherit}a{text-decoration:none;color:inherit}
.wrap{width:min(820px,calc(100% - 24px));margin:auto;padding:20px 0 70px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;gap:10px;align-items:center;font-weight:950}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--accent),#4bc9d5);box-shadow:0 10px 20px color-mix(in srgb,var(--accent) 22%,transparent)}
.back{padding:10px 13px;border-radius:13px;background:#fff;border:1px solid var(--line);color:#46516a;font-size:13px;font-weight:800}
.hero{background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:126px 1fr;gap:18px;align-items:center}
.cover{width:126px;aspect-ratio:.76;border-radius:18px;overflow:hidden;background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 20%,white)}
.cover img{width:100%;height:100%;object-fit:cover}
.kicker{font-size:11px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.hero h1{margin:7px 0 0;font-size:30px;letter-spacing:-.045em;line-height:1.05}
.section{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:8px}
.section h2{margin:0;font-size:21px;letter-spacing:-.03em}
.count{font-size:12px;color:var(--muted);font-weight:800}
.group-block{margin-top:14px}
.group-block:first-child{margin-top:0}
.group-title{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:14px;font-weight:950;color:#2d3b58}
.track-list{list-style:none;margin:0;padding:0}
.track{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid #edf0f4}
.track:last-child{border-bottom:0}
.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:12px;font-weight:950}
.track-name{font-size:14px;font-weight:850;line-height:1.4}
.play{width:34px;height:34px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:950;cursor:pointer}
.play.active{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 16%,transparent)}
.player-card{margin-top:14px;padding:14px;border-radius:18px;border:1px solid color-mix(in srgb,var(--accent) 18%,white);background:linear-gradient(135deg,#fff,var(--soft))}
.now{font-size:11px;color:var(--muted);margin-bottom:5px}
.now-title{font-size:15px;font-weight:950;margin-bottom:9px}
audio{width:100%;height:42px}
.empty{padding:25px 10px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:520px){
  .hero{grid-template-columns:88px 1fr;padding:15px;gap:13px}.cover{width:88px}.hero h1{font-size:23px}
  .track{grid-template-columns:32px minmax(0,1fr) 34px}
}

/* V28.2 — player directly under every song */
.track-inline{
  border-bottom:1px solid #edf0f4;
  padding:12px 4px 14px;
}
.track-inline:last-child{border-bottom:0}
.track-inline-head{
  display:grid;
  grid-template-columns:38px minmax(0,1fr);
  gap:10px;
  align-items:center;
  margin-bottom:9px;
}
.track-inline audio{
  width:100%;
  height:40px;
  display:block;
}
.track-inline-player{
  margin-left:48px;
  padding:9px 11px;
  border-radius:15px;
  background:linear-gradient(135deg,#fff,var(--soft));
  border:1px solid color-mix(in srgb,var(--accent) 16%,white);
}
@media(max-width:520px){
  .track-inline-player{margin-left:42px}
}


/* V28.3 — only the active song shows a player */
.track-select{
  border-bottom:1px solid #edf0f4;
  padding:11px 4px;
}
.track-select:last-child{border-bottom:0}
.track-select-head{
  display:grid;
  grid-template-columns:38px minmax(0,1fr) 38px;
  gap:10px;
  align-items:center;
}
.active-player-slot:empty{display:none}
.active-inline-player{
  margin:10px 48px 2px;
  padding:10px 12px;
  border-radius:16px;
  background:linear-gradient(135deg,#fff,var(--soft));
  border:1px solid color-mix(in srgb,var(--accent) 18%,white);
  animation:playerIn .18s ease both;
}
.active-inline-player audio{
  width:100%;
  height:40px;
  display:block;
}
@keyframes playerIn{
  from{opacity:0;transform:translateY(-4px)}
  to{opacity:1;transform:none}
}
.instant-loading{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  color:#7a8494;
  font-size:12px;
  font-weight:750;
}
.instant-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  animation:instantPulse .8s ease-in-out infinite alternate;
}
@keyframes instantPulse{
  from{opacity:.3;transform:scale(.8)}
  to{opacity:1;transform:scale(1.12)}
}
@media(max-width:520px){
  .active-inline-player{margin-left:42px;margin-right:0}
}


/* V28.4 — "Дагаад дуулаарай" 3-column song table */
.song-table{
  width:100%;
}
.song-head,
.song-row-main{
  display:grid;
  grid-template-columns:38px 1fr 1fr 1.25fr 38px;
  gap:10px;
  align-items:center;
}
.song-head{
  padding:8px 4px 10px;
  color:#7a8494;
  font-size:11px;
  font-weight:900;
  border-bottom:1px solid #e8ebf0;
}
.song-row{
  padding:10px 4px;
  border-bottom:1px solid #edf0f4;
}
.song-row:last-child{border-bottom:0}
.song-cell{
  min-width:0;
  font-size:13px;
  line-height:1.45;
  color:#33405a;
}
.song-title{
  font-weight:900;
  color:var(--ink);
}
.song-player-slot:empty{display:none}
.song-player{
  margin:10px 48px 0;
  padding:10px 12px;
  border-radius:16px;
  background:linear-gradient(135deg,#fff,var(--soft));
  border:1px solid color-mix(in srgb,var(--accent) 18%,white);
}
.song-player audio{width:100%;height:40px;display:block}
.public-song-table{
  width:100%;
  border-collapse:collapse;
  margin-top:6px;
}
.public-song-table th,
.public-song-table td{
  padding:10px 8px;
  border-bottom:1px solid #edf0f4;
  text-align:left;
  vertical-align:top;
  font-size:13px;
}
.public-song-table th{
  color:#6f7889;
  font-size:11px;
  font-weight:900;
}
@media(max-width:640px){
  .song-head{display:none}
  .song-row-main{
    grid-template-columns:32px minmax(0,1fr) 36px;
  }
  .song-row-main .song-cell.lyricist,
  .song-row-main .song-cell.composer{
    grid-column:2;
    font-size:11px;
    color:#7a8494;
  }
  .song-row-main .song-cell.song-title{
    grid-column:2;
    grid-row:1;
  }
  .song-row-main .play{
    grid-column:3;
    grid-row:1;
  }
  .song-player{margin-left:42px;margin-right:0}
}


/* V28.5 — public "Дагаад дуулаарай" matches the other numbered lists */
.public-song-grid{
  width:100%;
  margin-top:6px;
}
.public-song-head,
.public-song-row{
  display:grid;
  grid-template-columns:38px 1fr 1fr 1.25fr;
  gap:10px;
  align-items:center;
}
.public-song-head{
  padding:8px 4px 10px;
  border-bottom:1px solid #e8ebf0;
  color:#6f7889;
  font-size:11px;
  font-weight:900;
}
.public-song-row{
  padding:10px 4px;
  border-bottom:1px solid #edf0f4;
}
.public-song-row:last-child{border-bottom:0}
.public-song-row .song-cell{
  min-width:0;
  font-size:13px;
  line-height:1.45;
  color:#33405a;
}
.public-song-row .song-title{
  color:var(--ink);
  font-weight:900;
}
@media(max-width:640px){
  .public-song-head{
    grid-template-columns:32px 1fr 1fr 1.25fr;
    gap:7px;
    font-size:9.5px;
  }
  .public-song-row{
    grid-template-columns:32px 1fr 1fr 1.25fr;
    gap:7px;
  }
  .public-song-row .song-cell{
    font-size:11px;
  }
}

</style>
</head>
<body>
<script src="site-data.js?v=28.3"></script>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="logo">♫</span><span id="brand">Хөгжмийн дасгал ажлын дэвтэр</span></div>
    <a class="back" href="index.html">← Нүүр сайт</a>
  </div>

  <section class="hero">
    <div class="cover" id="cover"></div>
    <div>
      <div class="kicker" id="kicker"></div>
      <h1 id="title">Дэвтэр</h1>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 id="sectionTitle">Сонсох материал</h2>
      <span class="count" id="count"></span>
    </div>
    <div id="content"></div>
  </section>
</div>

<script>
(async()=>{
  const $=id=>document.getElementById(id);
  const params=new URLSearchParams(location.search);
  const gradeNumber=Math.max(1,Math.min(5,Number(params.get('grade'))||2));
  const group=(params.get('group')||'').trim();
  const trackCode=(params.get('track')||'').trim();

  const theme={
    1:{accent:'#57c8d4',soft:'#e8fbff'},
    2:{accent:'#f0a24e',soft:'#fff2e3'},
    3:{accent:'#2469eb',soft:'#eaf2ff'},
    4:{accent:'#5b4dc7',soft:'#f0edff'},
    5:{accent:'#2e9db8',soft:'#eafaff'}
  }[gradeNumber];

  document.documentElement.style.setProperty('--accent',theme.accent);
  document.documentElement.style.setProperty('--soft',theme.soft);

  // -------- FIRST PAINT: never show an empty generic page --------
  $('title').textContent=gradeNumber+'-р ангийн дэвтэр';
  $('cover').innerHTML=`<img src="grade${gradeNumber}.png" alt="${gradeNumber}-р ангийн дэвтэр">`;

  if(group==='listening'){
    $('kicker').textContent='СОНСОХ ХӨГЖИМ';
    $('sectionTitle').textContent='Сонсох хөгжим';
  }else if(group==='songs'){
    $('kicker').textContent='ДАГААД ДУУЛААРАЙ';
    $('sectionTitle').textContent='Дагаад дуулаарай';
  }else if(trackCode){
    $('kicker').textContent='';
    $('sectionTitle').textContent='';
  }else{
    $('kicker').textContent='СОНСОХ ХӨГЖМИЙН ЖАГСААЛТ';
    $('sectionTitle').textContent='Нэрс';
  }

  $('content').innerHTML=`
    <div class="instant-loading">
      <span class="instant-dot"></span>
      <span>Жагсаалтыг шинэчилж байна…</span>
    </div>`;

  let currentAudio=null;
  let currentTrackKey='';

  function normalizeTracks(grade){
    return (Array.isArray(grade?.listeningTracks)?grade.listeningTracks:[]).map(t=>{
      if(typeof t==='string') return {name:t,audio:'',type:'assessment',code:''};
      const x=Object.assign({},t||{});
      if(!x.type)x.type='assessment';
      if(x.lyricist===undefined)x.lyricist='';
      if(x.composer===undefined)x.composer='';
      if(x.exercise===undefined)x.exercise='';
      if(x.page===undefined)x.page='';
      return x;
    });
  }

  function stopCurrent(){
    if(currentAudio){
      try{ currentAudio.pause(); }catch(e){}
      currentAudio=null;
    }
  }

  function render(DATA){
    if(!DATA || typeof DATA!=='object') return false;

    $('brand').textContent=DATA.brand||'Хөгжмийн дасгал ажлын дэвтэр';

    const grade=(DATA.grades||[]).find(g=>Number(g.grade)===gradeNumber);
    if(!grade) return false;

    $('title').textContent=grade.title||gradeNumber+'-р ангийн дэвтэр';
    if(grade.image){
      $('cover').innerHTML=`<img src="${escAttr(grade.image)}" alt="${escAttr(grade.title||'')}">`;
    }

    const tracks=normalizeTracks(grade);

    // 1) Individual QR = one exercise/page track.
    if(trackCode){
      const t=tracks.find(x=>String(x.code||'')===trackCode);
      $('count').textContent='';
      $('kicker').textContent='';

      const fullTitle = t
        ? (t.type==='exercise'
            ? ((t.exercise||t.name||'Дасгал') + (t.page?` · Хуудас ${t.page}`:''))
            : (t.name||'Сонсох материал'))
        : 'Сонсох материал';

      if(!t || !(t.audio||t.url)){
        $('sectionTitle').textContent=fullTitle;
        $('content').innerHTML='<div class="empty">Сонсох материал олдсонгүй.</div>';
        return true;
      }

      $('sectionTitle').textContent=fullTitle;
      $('content').innerHTML=`
        <div class="player-card">
          <div class="now-title">${esc(fullTitle)}</div>
          <audio controls preload="metadata" controlsList="nodownload" src="${escAttr(t.audio||t.url||'')}"></audio>
        </div>`;
      return true;
    }

    // 2) Group QR = all listening tracks OR "Дагаад дуулаарай".
    if(group==='listening' || group==='songs'){
      const selected=tracks.filter(t=>t.type===group);
      const label=group==='listening'?'Сонсох хөгжим':'Дагаад дуулаарай';
      $('kicker').textContent=label.toUpperCase();
      $('sectionTitle').textContent=label;
      $('count').textContent=selected.length?selected.length+' материал':'';

      if(!selected.length){
        $('content').innerHTML='<div class="empty">Материал хараахан нэмэгдээгүй байна.</div>';
        return true;
      }

      const previousKey=currentTrackKey;

      if(group==='songs'){
        $('content').innerHTML=`
          <div class="song-table">
            <div class="song-head">
              <div>№</div>
              <div>Үг</div>
              <div>Ая</div>
              <div>Дууны нэр</div>
              <div></div>
            </div>
            ${selected.map((t,i)=>`
              <div class="song-row">
                <div class="song-row-main">
                  <span class="num">${i+1}</span>
                  <span class="song-cell lyricist">${esc(t.lyricist||'—')}</span>
                  <span class="song-cell composer">${esc(t.composer||'—')}</span>
                  <span class="song-cell song-title">${esc(t.name||'Нэргүй')}</span>
                  <button class="play" type="button" data-songplay="${i}" aria-label="Сонсох">▶</button>
                </div>
                <div class="song-player-slot" data-songslot="${i}"></div>
              </div>`).join('')}
          </div>`;

        const buttons=[...document.querySelectorAll('[data-songplay]')];

        function openSongPlayer(i,autoplay=true){
          const t=selected[i];
          const key=(t.code||'')+'|'+(t.audio||t.url||'')+'|song|'+i;
          stopCurrent();
          currentTrackKey=key;

          document.querySelectorAll('.song-player-slot').forEach(x=>x.innerHTML='');
          buttons.forEach((b,j)=>{
            b.classList.toggle('active',j===i);
            b.textContent=j===i?'❚❚':'▶';
          });

          const slot=document.querySelector(`[data-songslot="${i}"]`);
          slot.innerHTML=`
            <div class="song-player">
              <audio controls preload="metadata" controlsList="nodownload" src="${escAttr(t.audio||t.url||'')}"></audio>
            </div>`;
          currentAudio=slot.querySelector('audio');

          currentAudio.addEventListener('pause',()=>{ if(buttons[i])buttons[i].textContent='▶'; });
          currentAudio.addEventListener('play',()=>{ if(buttons[i])buttons[i].textContent='❚❚'; });
          currentAudio.addEventListener('ended',()=>{ if(buttons[i])buttons[i].textContent='▶'; });

          if(autoplay && (t.audio||t.url||'')) currentAudio.play().catch(()=>{});
        }

        buttons.forEach(btn=>btn.onclick=()=>{
          const i=+btn.dataset.songplay;
          const t=selected[i];
          const key=(t.code||'')+'|'+(t.audio||t.url||'')+'|song|'+i;
          if(currentAudio && currentTrackKey===key){
            if(currentAudio.paused) currentAudio.play().catch(()=>{});
            else currentAudio.pause();
            return;
          }
          openSongPlayer(i,true);
        });

        if(previousKey){
          const idx=selected.findIndex((t,i)=>((t.code||'')+'|'+(t.audio||t.url||'')+'|song|'+i)===previousKey);
          if(idx>=0) openSongPlayer(idx,false);
        }
        return true;
      }

      // Listening music list
      $('content').innerHTML=`
        <div class="track-list" id="groupTracks">
          ${selected.map((t,i)=>`
            <div class="track-select" data-row="${i}">
              <div class="track-select-head">
                <span class="num">${i+1}</span>
                <span class="track-name">${esc(t.name||'Нэргүй')}</span>
                <button class="play" type="button" data-play="${i}" aria-label="Сонсох">▶</button>
              </div>
              <div class="active-player-slot" data-slot="${i}"></div>
            </div>`).join('')}
        </div>`;

      const buttons=[...document.querySelectorAll('[data-play]')];

      function openPlayer(i,autoplay=true){
        const t=selected[i];
        const key=(t.code||'')+'|'+(t.audio||t.url||'')+'|'+i;

        stopCurrent();
        currentTrackKey=key;

        document.querySelectorAll('.active-player-slot').forEach(x=>x.innerHTML='');
        buttons.forEach((b,j)=>{
          b.classList.toggle('active',j===i);
          b.textContent=j===i?'❚❚':'▶';
        });

        const slot=document.querySelector(`[data-slot="${i}"]`);
        slot.innerHTML=`
          <div class="active-inline-player">
            <audio controls preload="metadata" controlsList="nodownload" src="${escAttr(t.audio||t.url||'')}"></audio>
          </div>`;

        currentAudio=slot.querySelector('audio');
        currentAudio.addEventListener('pause',()=>{ if(buttons[i])buttons[i].textContent='▶'; });
        currentAudio.addEventListener('play',()=>{ if(buttons[i])buttons[i].textContent='❚❚'; });
        currentAudio.addEventListener('ended',()=>{ if(buttons[i])buttons[i].textContent='▶'; });

        if(autoplay && (t.audio||t.url||'')) currentAudio.play().catch(()=>{});
      }

      buttons.forEach(btn=>btn.onclick=()=>{
        const i=+btn.dataset.play;
        const t=selected[i];
        const key=(t.code||'')+'|'+(t.audio||t.url||'')+'|'+i;

        if(currentAudio && currentTrackKey===key){
          if(currentAudio.paused) currentAudio.play().catch(()=>{});
          else currentAudio.pause();
          return;
        }
        openPlayer(i,true);
      });

      if(previousKey){
        const idx=selected.findIndex((t,i)=>((t.code||'')+'|'+(t.audio||t.url||'')+'|'+i)===previousKey);
        if(idx>=0) openPlayer(idx,false);
      }

      return true;
    }

    // 3) Public page = names only, no audio
    $('kicker').textContent='СОНСОХ ХӨГЖМИЙН ЖАГСААЛТ';
    $('sectionTitle').textContent='Нэрс';
    $('count').textContent=tracks.length?tracks.length+' материал':'';

    const groups=[
      ['listening','🎧 Сонсох хөгжим'],
      ['songs','🎤 Дагаад дуулаарай'],
      ['exercise','✏️ Дасгал'],
      ['assessment','📝 Гүйцэтгэлийн үнэлгээ']
    ];

    const html=groups.map(([type,label])=>{
      const arr=tracks.filter(t=>t.type===type);
      if(!arr.length)return '';

      if(type==='songs'){
        return `<div class="group-block">
          <div class="group-title">${label}</div>
          <div class="public-song-grid">
            <div class="public-song-head">
              <div>№</div>
              <div>Үг</div>
              <div>Ая</div>
              <div>Дууны нэр</div>
            </div>
            ${arr.map((t,i)=>`
              <div class="public-song-row">
                <span class="num">${i+1}</span>
                <span class="song-cell">${esc(t.lyricist||'—')}</span>
                <span class="song-cell">${esc(t.composer||'—')}</span>
                <span class="song-cell song-title">${esc(t.name||'Нэргүй')}</span>
              </div>`).join('')}
          </div>
        </div>`;
      }

      return `<div class="group-block">
        <div class="group-title">${label}</div>
        <ol class="track-list">
          ${arr.map((t,i)=>`
            <li class="track" style="grid-template-columns:38px minmax(0,1fr)">
              <span class="num">${i+1}</span>
              <span class="track-name">${esc(
                type==='exercise'
                  ? ((t.exercise||t.name||'Дасгал') + (t.page?` · Хуудас ${t.page}`:''))
                  : (t.name||'Нэргүй')
              )}</span>
            </li>`).join('')}
        </ol>
      </div>`;
    }).join('');

    $('content').innerHTML=html||'<div class="empty">Сонсох материал хараахан нэмэгдээгүй байна.</div>';
    return true;
  }

  // -------- INSTANT RENDER from existing in-page/local cache --------
  let DATA=window.MYDEWTER_DATA||{};
  let rendered=render(DATA);

  try{
    const cached=localStorage.getItem('mydewter_public_cache_v26');
    if(cached){
      const parsed=JSON.parse(cached);
      if(parsed && typeof parsed==='object'){
        DATA=Object.assign({},DATA,parsed);
        rendered=render(DATA)||rendered;
      }
    }
  }catch(e){}

  // -------- FRESH RENDER from Apps Script, no reload, no blank flash --------
  await (window.MYDEWTER_READY || Promise.resolve());

  DATA=Object.assign({},DATA,window.MYDEWTER_DATA||{});
  rendered=render(DATA)||rendered;

  try{
    const api=DATA.orderApiUrl||'';
    if(api){
      const res=await fetch(
        api+(api.includes('?')?'&':'?')+'action=getSiteData&_='+Date.now(),
        {cache:'no-store'}
      );
      const fresh=await res.json();

      if(fresh&&fresh.ok&&fresh.data){
        DATA=Object.assign({},DATA,fresh.data);
        window.MYDEWTER_DATA=DATA;
        try{
          localStorage.setItem('mydewter_public_cache_v26',JSON.stringify(DATA));
        }catch(e){}
        render(DATA);
      }
    }
  }catch(e){
    console.warn('Fresh audio data fetch failed',e);
    if(!rendered){
      $('content').innerHTML='<div class="empty">Материал ачаалж чадсангүй. Хуудсыг дахин нээнэ үү.</div>';
    }
  }

  function esc(v){
    return String(v||'')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;');
  }
  function escAttr(v){return esc(v)}
})();
</script>
</body>
</html>
